<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふらっとごはん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: スライドと同じ「セージグリーン＋オレンジのピン」の世界観。デスクトップは左にデモ手順、右にスマホ画面。スマホでは画面いっぱいにアプリ。 */
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface-2:#edf1e8; --surface-3:#e3eadf;
  --ink:#2c322e; --ink-2:#646d66; --line:#dfe2d7;
  --sage:#4f8160; --sage-deep:#3c6a4c; --on-sage:#ffffff; --sage-soft:#dbe7da;
  --pin:#e0623a; --pin-off:#a7aea8; --pin-soft:#fbe3d8;
  --ng:#c4432b; --ng-soft:#f8dfd8; --cc:#a8700f; --cc-soft:#f6ead0; --ok:#3f7a52; --ok-soft:#dcebdc;
  --map-land:#eef0e5; --map-block:#e2e7d8; --map-road:#ffffff; --map-casing:#d8dccd; --map-major:#fbf4e2; --map-park:#cfe1c4; --map-water:#cfe2ea; --map-campus:#d6e4d6; --map-label:#7a8379;
  --loc:#2f7fd0; --qr-bg:#ffffff; --qr-fg:#1f2621;
  --shadow:0 10px 30px rgba(52,64,54,.14);
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141815; --surface:#1d221e; --surface-2:#252c27; --surface-3:#2d3530;
  --ink:#e7ebe5; --ink-2:#a2aba3; --line:#343c36;
  --sage:#86b896; --sage-deep:#a7d2b4; --on-sage:#11261a; --sage-soft:#2a3d30;
  --pin:#f07c55; --pin-off:#6b746d; --pin-soft:#4a2c22;
  --ng:#f08b74; --ng-soft:#4a2620; --cc:#e5b25a; --cc-soft:#433416; --ok:#8fcb9f; --ok-soft:#24392a;
  --map-land:#1c211d; --map-block:#252c27; --map-road:#323a34; --map-casing:#2a312c; --map-major:#3c4038; --map-park:#24372a; --map-water:#1f3139; --map-campus:#2a3b2f; --map-label:#8d978e;
  --loc:#6aaef0; --qr-bg:#ffffff; --qr-fg:#1f2621;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1d221e; --surface-2:#252c27; --surface-3:#2d3530;
  --ink:#e7ebe5; --ink-2:#a2aba3; --line:#343c36;
  --sage:#86b896; --sage-deep:#a7d2b4; --on-sage:#11261a; --sage-soft:#2a3d30;
  --pin:#f07c55; --pin-off:#6b746d; --pin-soft:#4a2c22;
  --ng:#f08b74; --ng-soft:#4a2620; --cc:#e5b25a; --cc-soft:#433416; --ok:#8fcb9f; --ok-soft:#24392a;
  --map-land:#1c211d; --map-block:#252c27; --map-road:#323a34; --map-casing:#2a312c; --map-major:#3c4038; --map-park:#24372a; --map-water:#1f3139; --map-campus:#2a3b2f; --map-label:#8d978e;
  --loc:#6aaef0; --qr-bg:#ffffff; --qr-fg:#1f2621;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pin);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}

/* ---------- stage ---------- */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch}
.guide{display:none}
.app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
@media (min-width:900px){
  body{overflow:auto}
  .stage{gap:40px;align-items:center;padding-block:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:100%;height:auto}
  .guide{display:flex}
  .app{width:400px;height:min(820px,calc(100vh - 48px));min-height:620px;border-radius:36px;border:10px solid var(--ink);box-shadow:var(--shadow);flex:none}
  .guide-btn{display:none!important}
}

/* guide panel */
.guide{flex-direction:column;gap:18px;width:360px;max-width:100%}
.guide .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--sage);font-weight:700}
.guide h1{font-size:40px;font-weight:900;letter-spacing:.02em}
.guide .sub{font-family:var(--f-display);font-weight:700;color:var(--ink-2);margin-top:4px}
.guide .note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.flow h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.flow h3 span{background:var(--sage);color:var(--on-sage);border-radius:99px;padding:1px 12px;font-size:12px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.flow button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;transition:border-color .15s,transform .15s}
.flow button:hover{border-color:var(--sage);transform:translateX(2px)}
.flow .num{flex:none;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--pin);display:grid;place-items:center}
.flow .num b{transform:rotate(45deg);color:#fff;font-size:11px}
.flow .t{font-weight:700;font-size:13px}
.flow .d{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.guide .guide-close{display:none}
.guide.open{display:flex;position:absolute;inset:0;z-index:60;background:var(--surface);overflow:auto;width:auto;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.guide.open .guide-close{display:grid;align-self:flex-end}

/* ---------- app chrome ---------- */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:900;font-size:18px;white-space:nowrap}
.brand svg{width:20px;height:20px;color:var(--pin)}
.seg{margin-left:auto;display:flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{border:0;background:none;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--sage);color:var(--on-sage)}
.icon-btn{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.main{flex:1;min-height:0;overflow:auto;position:relative}
.main.is-map{display:flex;flex-direction:column;overflow:hidden}
.tabbar{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--surface);padding-bottom:4px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 3px;font-size:10.5px;color:var(--ink-2);font-weight:500}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--sage);font-weight:700}
.pad{padding:16px}
.section-title{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:12px}

/* chips & pills */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;padding:1px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
.chip.hit{background:var(--ng-soft);color:var(--ng);border-color:var(--ng);font-weight:700}
.chip.cchit{background:var(--cc-soft);color:var(--cc);border-color:var(--cc);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}
.pill.cc{background:var(--cc-soft);color:var(--cc)}
.pill.old{background:var(--cc-soft);color:var(--cc)}
.pill.fresh{background:var(--surface-2);color:var(--ink-2);font-weight:500}

.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--sage);color:var(--on-sage);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}

/* ---------- map ---------- */
.filterbar{flex:none;padding:10px 12px 8px;display:grid;gap:8px;background:var(--surface)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px}
.search svg{width:16px;height:16px;color:var(--ink-2);flex:none}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%;min-width:0}
.avoid{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.avoid .lbl{color:var(--ink-2);white-space:nowrap}
.avoid .chips{flex-wrap:nowrap;overflow:auto;min-width:0}
.avoid .edit{margin-left:auto;border:0;background:none;color:var(--sage);font-weight:700;font-size:12px;white-space:nowrap;padding:0}
.mapwrap{position:relative;flex:1 1 56%;min-height:220px;background:var(--map-land);overflow:hidden}
.mapwrap svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapwrap svg.map:active{cursor:grabbing}
.m-land{fill:var(--map-land)} .m-block{fill:var(--map-block)} .m-park{fill:var(--map-park)} .m-water{fill:var(--map-water)} .m-campus{fill:var(--map-campus);stroke:var(--sage);stroke-width:2;stroke-dasharray:6 4}
.m-road{stroke:var(--map-road);fill:none;stroke-linecap:round} .m-casing{stroke:var(--map-casing);fill:none;stroke-linecap:round} .m-major{stroke:var(--map-major);fill:none;stroke-linecap:round}
.m-label{fill:var(--map-label);font-size:15px;font-weight:700;font-family:var(--f-display);letter-spacing:.15em}
.m-label.sm{font-size:12px;letter-spacing:.05em}
.m-sta{fill:var(--surface);stroke:var(--sage);stroke-width:3}
.m-sta-t{fill:var(--sage);font-size:11px;font-weight:900;text-anchor:middle;dominant-baseline:central;font-family:var(--f-body)}
.pin path{fill:var(--pin);stroke:var(--surface);stroke-width:2}
.pin.off path{fill:var(--pin-off)}
.pin .hole{fill:var(--surface)}
.pin .badge{fill:var(--surface);stroke:var(--pin);stroke-width:2}
.pin.off .badge{stroke:var(--pin-off)}
.pin .bt{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink);font-family:var(--f-body)}
.pin{cursor:pointer}
.pin.sel path{fill:var(--sage-deep)}
.pin.sel .badge{stroke:var(--sage-deep)}
.loc-ring{fill:var(--loc);opacity:.18}
.loc-dot{fill:var(--loc);stroke:var(--surface);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.loc-ring{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes ping{0%{transform:scale(.5);opacity:.35}100%{transform:scale(1.4);opacity:0}}
.mapctl{position:absolute;top:10px;right:10px;display:grid;gap:6px}
.mapctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mapctl svg{width:18px;height:18px}
.maptag{position:absolute;left:8px;top:10px;font-size:10.5px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);padding:2px 8px;border-radius:99px;max-width:calc(100% - 70px)}
.mapcard{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;border:1px solid var(--line)}
.mapcard .info{min-width:0;flex:1}
.mapcard .nm{font-weight:700;font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listwrap{flex:1 1 44%;min-height:0;overflow:auto;border-top:1px solid var(--line);background:var(--surface)}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px;position:sticky;top:0;background:var(--surface);z-index:1}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:0;background:none;color:var(--ink-2);padding:0}
.toggle .sw{width:30px;height:18px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"] .sw{background:var(--sage)}
.toggle[aria-pressed="true"] .sw::after{left:14px}
.shoplist{list-style:none;margin:0;padding:4px 10px 14px;display:grid;gap:6px}
.shoprow{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px}
.shoprow:hover{border-color:var(--sage)}
.shoprow .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:var(--sage)}
.shoprow .info{flex:1;min-width:0}
.shoprow .nm{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shoprow .meta{display:block;font-size:11.5px;color:var(--ink-2)}
.okcount{flex:none;text-align:center;line-height:1.1}
.okcount b{display:block;font-size:18px;font-family:var(--f-display);color:var(--ok)}
.okcount.zero b{color:var(--pin-off)}
.okcount span{font-size:10px;color:var(--ink-2)}

/* ---------- detail ---------- */
.dhead{padding:12px 16px 14px;background:var(--surface-2);display:grid;gap:8px}
.back{border:0;background:none;display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:12.5px;padding:0;justify-self:start}
.back svg{width:16px;height:16px}
.dhead h2{font-size:22px;font-weight:900}
.dmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.dactions{display:flex;gap:8px}
.dactions .btn{flex:1}
.dhead .btn.ghost{background:var(--surface)}
.btn.faved{background:var(--pin-soft);color:var(--pin)}
.qrbanner{display:flex;gap:8px;align-items:center;background:var(--sage);color:var(--on-sage);padding:8px 16px;font-size:12.5px;font-weight:700}
.qrbanner svg{width:18px;height:18px;flex:none}
.disclaimer{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 10px;margin:12px 16px 0}
.disclaimer svg{width:16px;height:16px;flex:none;color:var(--cc);margin-top:2px}
.dtabs{display:flex;gap:4px;padding:12px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.dtabs button{border:0;background:none;padding:8px 10px;font-weight:700;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:13px}
.dtabs button[aria-current="true"]{color:var(--ink);border-color:var(--pin)}
.menus{list-style:none;margin:0;padding:12px 16px 20px;display:grid;gap:10px}
.mcard{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mcard.ng{background:color-mix(in srgb,var(--ng-soft) 35%,var(--surface))}
.mtop{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.mname{font-weight:700;font-size:15px}
.price{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mmore{border:0;background:none;color:var(--sage);font-weight:700;font-size:12.5px;padding:0;justify-self:start;display:inline-flex;align-items:center;gap:4px}
.mmore svg{width:14px;height:14px;transition:transform .15s}
.mmore[aria-expanded="true"] svg{transform:rotate(180deg)}
.ing{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:12.5px;display:grid;gap:6px}
.ing dt{font-size:11px;color:var(--ink-2);font-weight:700}
.ing dd{margin:0}
.ing dl{margin:0;display:grid;gap:6px}
.checked{font-size:11px;color:var(--ink-2)}
.info-list{list-style:none;margin:0;padding:12px 16px 20px;display:grid;gap:10px}
.info-list li{display:grid;grid-template-columns:84px 1fr;gap:8px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:10px}
.info-list li span:first-child{color:var(--ink-2);font-size:12px}
.quote{margin:0 16px 20px;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:13px}
.quote b{display:block;font-size:11px;color:var(--sage);margin-bottom:2px}

/* reviews */
.rv{list-style:none;margin:0;padding:12px 16px 4px;display:grid;gap:10px}
.rv li{border-bottom:1px solid var(--line);padding-bottom:10px;display:grid;gap:4px}
.stars{color:var(--pin);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--line)}
.rvform{margin:8px 16px 20px;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px}
.starpick{display:flex;gap:2px}
.starpick button{border:0;background:none;font-size:26px;line-height:1;color:var(--line);padding:0 2px}
.starpick button.on{color:var(--pin)}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:12px;padding:3px 10px}
.tagpick button[aria-pressed="true"]{background:var(--sage-soft);border-color:var(--sage);color:var(--sage-deep);font-weight:700}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--sage)}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--ink-2)}

/* QR */
.scanner{margin:16px;border-radius:20px;background:#1b201c;aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;display:grid;place-items:center}
.scanner .frame{width:52%;aspect-ratio:1;position:relative}
.scanner .frame::before,.scanner .frame::after{content:"";position:absolute;inset:0;border:3px solid #fff;border-radius:14px;clip-path:polygon(0 0,28% 0,28% 6%,6% 6%,6% 28%,0 28%,0 72%,6% 72%,6% 94%,28% 94%,28% 100%,72% 100%,72% 94%,94% 94%,94% 72%,100% 72%,100% 28%,94% 28%,94% 6%,72% 6%,72% 0,100% 0,100% 100%,0 100%)}
.scanner .frame::after{display:none}
.scanner .line{position:absolute;left:8%;right:8%;height:2px;background:#f07c55;top:50%;box-shadow:0 0 12px #f07c55}
.scanner.busy .line{animation:scan .9s ease-in-out infinite alternate}
@keyframes scan{from{top:10%}to{top:90%}}
.scanner .hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#e8ece6;font-size:12px}
.scanner .held{position:absolute;inset:0;display:grid;place-items:center}
.scanner .held svg{width:40%;border-radius:6px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:0 16px 20px}
.qrpick{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:11.5px;font-weight:700}
.qrpick:hover{border-color:var(--sage)}
.qrpick svg{width:64px;height:64px}
svg.qr .qr-bg{fill:var(--qr-bg)} svg.qr .qr-fg{fill:var(--qr-fg)}

function statusOf(menu){
  const P = S.profile;
  const hit = menu.al.filter(a => P.includes(a));

  const cc = menu.cc.filter(a => P.includes(a));
  if (cc.length) return {k:'cc', hit:cc};
  return {k:'ok', hit:[]};
}

  if (dateStr === '9999-12-31') return '';
  const d = daysSince(dateStr);
  const txt = d <= 0 ? '今日' : d + '日前';
  return `<span class="pill ${d >= 14 ? 'old' : 'fresh'}">最新確認 ${md(dateStr)}（${txt}）</span>`;
}
function statusPill(menu){
  const st = statusOf(menu);
  if (!S.profile.length) return '';
  if (st.k === 'ng') return `<span class="pill ng">${IC.x}${esc(st.hit.map(alName).join('・'))}を含む</span>`;
  if (st.k === 'cc') return `<span class="pill cc">${IC.alert}調理場で混ざる可能性</span>`;

function qrSvg(text){
  try {
    const q = qrcode(0,'M'); q.addData(text); q.make();
    const n = q.getModuleCount(); let d = '';
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg class="qr" viewBox="-2 -2 ${n+4} ${n+4}" role="img" aria-label="QRコード" shape-rendering="crispEdges"><rect class="qr-bg" x="-2" y="-2" width="${n+4}" height="${n+4}"/><path class="qr-fg" d="${d}"/></svg>`;
  } catch(e) {
    return `<svg class="qr" viewBox="0 0 10 10"><rect class="qr-bg" width="10" height="10"/><text x="5" y="5.5" font-size="1.4" text-anchor="middle" class="qr-fg">QR</text></svg>`;
  }
}

function fitAspect(){
  const r = svg.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
  vb.h = vb.w * r.height / r.width;
  vb.x = cx - vb.w/2; vb.y = cy - vb.h/2;
}
function clampVB(){
  vb.w = Math.min(Math.max(vb.w, 220), 1000);
  const r = svg.getBoundingClientRect();
  if (r.width > 10) vb.h = vb.w * r.height / r.width;
  const minX = -60, maxX = MAP_W + 60 - vb.w, minY = MAP_TOP, maxY = MAP_BOTTOM - vb.h;
  vb.x = maxX < minX ? (minX+maxX)/2 : Math.min(Math.max(vb.x, minX), maxX);
  vb.y = maxY < minY ? (minY+maxY)/2 : Math.min(Math.max(vb.y, minY), maxY);
}
function applyVB(){
  clampVB();
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r = svg.getBoundingClientRect();
  const k = r.width > 10 ? vb.w / r.width : 1;
  svg.querySelectorAll('.pin').forEach(p => p.setAttribute('transform', `translate(${p.dataset.x} ${p.dataset.y}) scale(${(p.classList.contains('sel')?1.25:1)*k})`));
  const loc = svg.querySelector('#loc');
  loc.setAttribute('transform', `translate(${USER_LOC.x} ${USER_LOC.y}) scale(${k}) translate(${-USER_LOC.x} ${-USER_LOC.y})`);
}
function renderPins(){

  svg.querySelector('#pins').innerHTML = sorted.map(s => {

    return `<g class="pin ${n?'':'off'} ${ui.sel===s.id?'sel':''}" data-pin="${s.id}" data-x="${s.x}" data-y="${s.y}" role="button" aria-label="${esc(s.name)}">
      <path d="M0 0C-5-10-15-17-15-29A15 15 0 1 1 15-29C15-17 5-10 0 0Z"/><circle class="hole" cx="0" cy="-29" r="6"/>
      <circle class="badge" cx="13" cy="-42" r="10"/><text class="bt" x="13" y="-41.5">${n}</text></g>`;
  }).join('');
  applyVB();
  const card = mapWrap.querySelector('#mapcard');

  card.innerHTML = s ? `<div class="mapcard"><div class="info"><div class="nm">${esc(s.name)}</div><div class="small muted">${esc(s.genre)}・徒歩${walkMin(s)}分・${S.profile.length?`安心メニュー ${okCount(s)}/${s.menus.length}品`:`メニュー ${s.menus.length}品`}</div></div><button class="btn sm" data-act="open:${s.id}">原材料を見る</button></div>` : '';
}
function centerOn(x, y, w){ if (w) vb.w = w; const r = svg.getBoundingClientRect(); vb.h = vb.w * (r.height||1) / (r.width||1); vb.x = x - vb.w/2; vb.y = y - vb.h/2; applyVB(); }
function zoomAt(f, cx, cy){
  const nw = Math.min(Math.max(vb.w * f, 220), 1000); const ff = nw / vb.w;
  vb.x = cx - (cx - vb.x) * ff; vb.y = cy - (cy - vb.y) * ff; vb.w = nw; applyVB();
}
const toMap = (clientX, clientY) => { const r = svg.getBoundingClientRect(); return {x: vb.x + (clientX - r.left)/r.width*vb.w, y: vb.y + (clientY - r.top)/r.height*vb.h}; };
(function bindMap(){
  const pts = new Map(); let moved = 0, last = null, pinch = null;
  svg.addEventListener('pointerdown', e => { pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = 0; last = {x:e.clientX, y:e.clientY}; if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y)}; } });
  window.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const r = svg.getBoundingClientRect();
    if (pts.size === 2 && pinch){
      const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y);
      const c = toMap((a.x+b.x)/2, (a.y+b.y)/2); zoomAt(pinch.d/d, c.x, c.y); pinch.d = d; moved += 10; return;
    }
    if (pts.size === 1 && last){
      const dx = e.clientX - last.x, dy = e.clientY - last.y; moved += Math.abs(dx) + Math.abs(dy);
      vb.x -= dx / r.width * vb.w; vb.y -= dy / r.height * vb.h; last = {x:e.clientX, y:e.clientY}; applyVB();
    }
  });
  const up = e => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size === 0){
      if (moved < 8){
        const pin = e.target.closest && e.target.closest('[data-pin]');
        ui.sel = pin ? pin.dataset.pin : null; renderPins();
      }
      last = null;
    } else { last = [...pts.values()][0]; }
  };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); const c = toMap(e.clientX, e.clientY); zoomAt(e.deltaY > 0 ? 1.12 : 1/1.12, c.x, c.y); }, {passive:false});
  new ResizeObserver(() => { if (mapWrap.isConnected) applyVB(); }).observe(mapWrap);
})();

function visibleShops(){

    if (ui.onlyOk && S.profile.length && !okCount(s)) return false;
    if (!q) return true;
    return s.name.includes(q) || s.genre.includes(q) || s.menus.some(mm => mm.name.includes(q) || mm.ing.includes(q));

}

function renderPhoto(){

function runOCR(){

    if (!ui.ed) return;

    if (!$('#ed-name').value) $('#ed-name').value = 'オムライス（写真から登録）';
    autoDetect(); renderPhoto(); toast('原材料を読み取りました。内容を確認してください');
  }, 1300);
}
function autoDetect(){
  const e = ui.ed; const found = detect($('#ed-ing').value);
  e.auto = new Set(found);
  found.forEach(id => { if (!e.off.has(id)) e.al.add(id); });
  renderEdChips();
}
function renderEdChips(){
  const e = ui.ed;
  $('#ed-al').innerHTML = ALLERGENS.map(a => `<button type="button" data-act="eda:${a.id}" aria-pressed="${e.al.has(a.id)}" class="${e.auto.has(a.id)&&e.al.has(a.id)?'auto':''}">${esc(a.label)}</button>`).join('');
  $('#ed-cc').innerHTML = ALLERGENS.map(a => `<button type="button" data-act="edc:${a.id}" aria-pressed="${e.cc.has(a.id)}">${esc(a.label)}</button>`).join('');
}
function renderEdDel(){
  const el = $('#ed-del'); if (!el || !ui.ed.id) return;
  el.innerHTML = ui.ed.del ? `<div class="srow"><span class="grow small">このメニューを削除しますか？</span><button class="btn sm danger" data-act="del-yes">削除する</button><button class="btn sm ghost" data-act="del-no">やめる</button></div>` : `<button class="btn sm danger" data-act="del-ask">このメニューを削除</button>`;
}
function saveEditor(){
  const e = ui.ed, s = shopById(S.storeId);
  const name = $('#ed-name').value.trim(), price = parseInt($('#ed-price').value,10), ing = $('#ed-ing').value.trim(), note = $('#ed-note').value.trim();
  if (!name){ toast('メニュー名を入力してください'); $('#ed-name').focus(); return; }
  if (!ing){ toast('原材料を入力してください'); $('#ed-ing').focus(); return; }
  const order = id => ALLERGENS.findIndex(a => a.id === id);
  const data = {name, price: isNaN(price)?0:price, ing, note, al:[...e.al].sort((a,b)=>order(a)-order(b)), cc:[...e.cc].filter(id=>!e.al.has(id)).sort((a,b)=>order(a)-order(b)), checked:iso(TODAY)};
  if (e.id){ Object.assign(s.menus.find(x => x.id === e.id), data); }
  else s.menus.push(Object.assign({id:uid()}, data));
  save(); closeEditor(); render(); toast(`「${name}」を公開しました`);
}
function closeEditor(){ ui.ed = null; $('#editorSlot').innerHTML = ''; }

/* ---------- tabbar & render ---------- */
function renderTabbar(){
  const tabs = ui.mode === 'user'
    ? [['map','地図',IC.map],['fav','行きたい',IC.heart],['qr','QR読み取り',IC.qr],['me','マイ設定',IC.user]]
    : [['home','ホーム',IC.home],['menus','メニュー',IC.list],['qr','店頭QR',IC.qr]];
  const cur = ui.mode === 'user' ? (ui.shop ? 'map' : ui.tab) : ui.stab;
  $('#tabbar').innerHTML = tabs.map(([id,l,ic]) => `<button data-act="${ui.mode==='user'?'tab':'stab'}:${id}" aria-current="${cur===id}">${ic}<span>${l}</span></button>`).join('');
  $('#seg-user').setAttribute('aria-pressed', ui.mode === 'user');
  $('#seg-store').setAttribute('aria-pressed', ui.mode === 'store');
}
let lastView = '';
function render(){
  renderTabbar();
  const view = ui.mode + ':' + (ui.mode==='user' ? (ui.shop ? 'shop-'+ui.shop+'-'+ui.shopTab : ui.tab) : ui.stab);
  const keepScroll = view === lastView ? main.scrollTop : 0;
  if (ui.mode === 'user'){
    if (ui.shop) renderDetail();
    else ({map:renderMap, fav:renderFav, qr:renderQR, me:renderMe})[ui.tab]();
  } else ({home:renderStoreHome, menus:renderStoreMenus, qr:renderStoreQR})[ui.stab]();
  main.scrollTop = keepScroll; lastView = view;
}

function openShop(id, opts){
  ui.shop = id; ui.shopTab = (opts && opts.tab) || 'menu'; ui.open = new Set(); ui.menuOnlyOk = false; ui.review = {stars:0,tags:[]};
  ui.fromQR = (opts && opts.qr) || null; ui.sel = id;
  if (S.stats[id]) { S.stats[id].views++; save(); }
  render();
}

/* ---------- actions ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const [act, a1, a2] = t.dataset.act.split(':');
  switch (act){
    case 'mode': ui.mode = a1; ui.shop = null; ui.fromQR = null; closeEditor(); render(); break;
    case 'tab': ui.mode = 'user'; ui.tab = a1; ui.shop = null; if (a1 !== 'qr') ui.fromQR = null; ui.resetAsk = false; render(); break;
    case 'stab': ui.mode = 'store'; ui.stab = a1; render(); break;
    case 'open': openShop(a1); break;
    case 'back': { const q = ui.fromQR; ui.shop = null; ui.fromQR = null; ui.tab = q ? 'qr' : 'map'; render(); break; }
    case 'fav': { const i = S.favs.indexOf(a1); if (i >= 0){ S.favs.splice(i,1); S.stats[a1].saved--; toast('行きたいリストから外しました'); } else { S.favs.push(a1); S.stats[a1].saved++; toast('行きたいリストに保存しました'); } save(); render(); break; }
    case 'stab-d': ui.shopTab = a1; render(); break;
    case 'tm': ui.open.has(a1) ? ui.open.delete(a1) : ui.open.add(a1); render(); break;
    case 'menuonly': ui.menuOnlyOk = !ui.menuOnlyOk; render(); break;
    case 'onlyok': ui.onlyOk = !ui.onlyOk; renderList(); renderPins(); break;
    case 'pf': { const i = S.profile.indexOf(a1); i >= 0 ? S.profile.splice(i,1) : S.profile.push(a1); save(); render(); break; }
    case 'strict': S.strict = !S.strict; save(); render(); break;
    case 'reset': ui.resetAsk = true; render(); break;
    case 'reset-no': ui.resetAsk = false; render(); break;
    case 'reset-yes': S = seed(); save(); ui.resetAsk = false; ui.sel = null; render(); toast('最初の状態に戻しました'); break;
    case 'star': ui.review.stars = +a1; document.querySelectorAll('.starpick button').forEach((b,i) => b.classList.toggle('on', i < ui.review.stars)); break;
    case 'rtag': { const n = +a1, i = ui.review.tags.indexOf(n); i >= 0 ? ui.review.tags.splice(i,1) : ui.review.tags.push(n); t.setAttribute('aria-pressed', i < 0); break; }
    case 'scan': {
      if (ui.scanning) break;
      ui.scanning = {shop:a1, table:+a2}; renderQR();
      setTimeout(() => { const sc = ui.scanning; ui.scanning = null; if (S.stats[sc.shop]) S.stats[sc.shop].qr++; save(); if (ui.mode==='user' && ui.tab==='qr' && !ui.shop) openShop(sc.shop, {qr:sc}); }, 1100);
      break;
    }
    case 'try-qr': { const sid = S.storeId; ui.mode = 'user'; ui.tab = 'qr'; ui.shop = null; render(); setTimeout(() => { const b = document.querySelector(`[data-act^="scan:${sid}:"]`); if (b) b.click(); }, 300); break; }
    case 'zoom': { zoomAt(a1 === 'in' ? 0.75 : 1.33, vb.x + vb.w/2, vb.y + vb.h/2); break; }
    case 'locate': centerOn(USER_LOC.x, USER_LOC.y - 20, 520); break;
    case 'new-menu': openEditor(null); break;
    case 'edit': openEditor(a1); break;
    case 'close-ed': closeEditor(); break;
    case 'save-ed': saveEditor(); break;
    case 'sample-photo': ui.ed.photo = 'sample'; runOCR(); break;
    case 'eda': { const e = ui.ed; if (e.al.has(a1)){ e.al.delete(a1); e.off.add(a1); } else { e.al.add(a1); e.off.delete(a1); } renderEdChips(); break; }
    case 'edc': { const e = ui.ed; e.cc.has(a1) ? e.cc.delete(a1) : e.cc.add(a1); renderEdChips(); break; }
    case 'del-ask': ui.ed.del = true; renderEdDel(); break;
    case 'del-no': ui.ed.del = false; renderEdDel(); break;
    case 'del-yes': { const s = shopById(S.storeId); s.menus = s.menus.filter(x => x.id !== ui.ed.id); save(); closeEditor(); render(); toast('メニューを削除しました'); break; }
    case 'confirm': { const s = shopById(S.storeId); const mm = s.menus.find(x => x.id === a1); mm.checked = iso(TODAY); save(); render(); toast(`「${mm.name}」を確認済みにしました`); break; }
    case 'confirm-all': { shopById(S.storeId).menus.forEach(mm => mm.checked = iso(TODAY)); save(); render(); toast('すべてのメニューを今日の日付で確認済みにしました'); break; }
    case 'toggle-guide': $('#guide').classList.toggle('open'); break;
    case 'guide': runGuide(a1); break;
  }
});

function runGuide(step){
  $('#guide').classList.remove('open');
  closeEditor();
  switch (step){
    case 'u1': ui.mode='user'; ui.tab='map'; ui.shop=null; ui.fromQR=null; ui.sel='s1'; render(); setTimeout(() => centerOn(480, 560, 560), 60); break;
    case 'u2': ui.mode='user'; openShop('s1'); { const s = shopById('s1'); if (s.menus[0]) { ui.open.add(s.menus[0].id); render(); } } break;
    case 'u3': ui.mode='user'; openShop('s3'); toast('「行きたい」で保存できます'); break;
    case 'u4': ui.mode='user'; ui.tab='qr'; ui.shop=null; ui.fromQR=null; render(); break;
    case 'u5': ui.mode='user'; openShop('s1', {tab:'review'}); break;
    case 's1': ui.mode='store'; ui.stab='menus'; render(); openEditor(null); break;
    case 's2': ui.mode='store'; ui.stab='menus'; render(); break;
    case 's3': ui.mode='store'; ui.stab='home'; render(); break;
  }
}

render();
})();
</script>
</body>
</html>
